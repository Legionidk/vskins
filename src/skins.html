<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="/src/style.css" rel="stylesheet" />
    </head>
    <body
        class="flex flex-col items-center gap-5 min-h-screen bg-[url(img/background.png)] bg-cover bg-no-repeat font-[Oswald] text-[#FDFDFD]"
    >
        <div
            class="hidden flex justify-center items-center fixed w-full min-h-screen top-0"
            id="popup-container"
        >
            <div class="rounded-2xl bg-[#211E1F] z-1 w-80 p-2" id="popup">
                <img
                    src="img/rigby.jpg"
                    alt="Rigby image"
                    class="rounded-lg"
                    id="cat-img"
                />
            </div>
            <div
                class="bg-black/50 h-screen w-full fixed z-0"
                id="background-popup"
            ></div>
        </div>

        <div
            class="hidden flex justify-center items-center fixed w-full min-h-screen top-0"
            id="popup-container"
        >
            <div
                class="rounded-2xl bg-[#292727] w-101 md:w-126 lg:w-187 z-1 overflow-hidden"
                id="popup"
            >
                <div
                    class="flex items-center justify-between w-full px-4 py-2 text-xl lg:text-2xl"
                    id="title"
                >
                    <p id="skin-name">Dolmir's Revenge Vandal</p>
                    <img
                        src="https://media.valorant-api.com/contenttiers/e046854e-406c-37f4-6607-19a9ba8426fc/displayicon.png"
                        alt="Exclusive edition image"
                        class="h-6 lg:h-7"
                        id="edition-image"
                    />
                </div>

                <video
                    src="https://valorant.dyn.riotcdn.net/x/videos/release-12.04/e1629d5a-4ebc-728b-3608-e6a5625b9841_default_universal.mp4"
                    autoplay
                    controls
                    class="w-full bg-[#211E1F] p-1 flex justify-center items-center"
                    id="video-preview"
                ></video>

                <div
                    class="flex flex-col items-center p-2 gap-2"
                    id="skin-info-wrapper"
                >
                    <img
                        src="https://media.valorant-api.com/weaponskins/3a079e06-4b63-2293-fbd8-4fb896e8af3d/displayicon.png"
                        alt="Dolmir's Revenge Vandal"
                        class="h-18 w-fit lg:h-26"
                        id="image-preview"
                    />

                    <div
                        class="flex justify-between w-full"
                        id="buttons-container"
                    >
                        <div class="flex gap-2" id="chroma-buttons">
                            <button
                                class="h-8 w-8 rounded-lg border-2 border-[#FF4248] hover:border-[#FF4248] overflow-hidden lg:h-10 lg:w-10"
                                id="chroma-0-button"
                            >
                                <img
                                    src="https://media.valorant-api.com/weaponskinchromas/f3a01eb6-405b-70de-4f5e-5eb2ced246a9/swatch.png"
                                    class="w-full"
                                    id="chroma-0-image"
                                />
                            </button>
                            <button
                                class="h-8 w-8 rounded-lg border-2 border-[#211E1F] hover:border-[#FF4248] overflow-hidden lg:h-10 lg:w-10"
                                id="chroma-1-button"
                            >
                                <img
                                    src="https://media.valorant-api.com/weaponskinchromas/860fb017-4024-03e5-b79b-5d82013377c3/swatch.png"
                                    class="w-full"
                                    id="chroma-1-image"
                                />
                            </button>
                            <button
                                class="h-8 w-8 rounded-lg border-2 border-[#211E1F] hover:border-[#FF4248] overflow-hidden lg:h-10 lg:w-10"
                                id="chroma-2-button"
                            >
                                <img
                                    src="https://media.valorant-api.com/weaponskinchromas/11363834-4349-d39a-ff2f-918f788e37bc/swatch.png"
                                    class="w-full"
                                    id="chroma-2-image"
                                />
                            </button>
                            <button
                                class="h-8 w-8 rounded-lg border-2 border-[#211E1F] hover:border-[#FF4248] overflow-hidden lg:h-10 lg:w-10"
                                id="chroma-3-button"
                            >
                                <img
                                    src="https://media.valorant-api.com/weaponskinchromas/9713703b-4b2e-e681-0894-7380ed3bdb7f/swatch.png"
                                    class="w-full"
                                    id="chroma-3-image"
                                />
                            </button>
                        </div>

                        <div class="flex gap-2" id="level-buttons">
                            <button
                                class="text-xl font-light h-8 w-8 rounded-lg bg-[#211E1F] border-2 border-[#FF4248] hover:border-[#FF4248] lg:h-10 lg:w-10 lg:text-2xl"
                                id="level-0-button"
                            >
                                I
                            </button>
                            <button
                                class="text-xl font-light h-8 w-8 rounded-lg bg-[#211E1F] border-2 border-[#211E1F] hover:border-[#FF4248] lg:h-10 lg:w-10 lg:text-2xl"
                                id="level-1-button"
                            >
                                II
                            </button>
                            <button
                                class="text-xl font-light h-8 w-8 rounded-lg bg-[#211E1F] border-2 border-[#211E1F] hover:border-[#FF4248] lg:h-10 lg:w-10 lg:text-2xl"
                                id="level-2-button"
                            >
                                III
                            </button>
                            <button
                                class="text-xl font-light h-8 w-8 rounded-lg bg-[#211E1F] border-2 border-[#211E1F] hover:border-[#FF4248] lg:h-10 lg:w-10 lg:text-2xl"
                                id="level-3-button"
                            >
                                IV
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div
                class="bg-black/50 h-screen w-full fixed z-0"
                id="background-popup"
            ></div>
        </div>

        <header
            class="flex items-center justify-center gap-6 w-full px-24 py-2 bg-[#111111] border-b-2 border-[#333333] text-lg md:justify-start lg:text-xl lg:px-49"
        >
            <img
                src="/src/img/asgard.svg"
                alt="Asgard logo"
                class="h-5"
                id="asgard-logo"
            />
            <div class="flex gap-2" id="nav-buttons">
                <a
                    href="../index.html"
                    class="rounded-lg px-4 py-2 hover:bg-[#292727]"
                    id="weapons-button"
                    >Weapons</a
                >
                <a
                    href="#"
                    class="rounded-lg px-4 py-2 pointer-events-none text-[#FF4248]"
                    id="skins-button"
                    >Skins</a
                >
                <a
                    href="agents.html"
                    class="rounded-lg px-4 py-2 hover:bg-[#292727]"
                    id="agents-button"
                    >Agents</a
                >
            </div>
        </header>

        <main
            class="flex flex-col items-center justify-center gap-5 px-24 w-full lg:px-49"
        >
            <div
                class="grid grid-cols-2 gap-2 w-full md:grid-cols-[auto_auto_auto]"
                id="search-container"
            >
                <input
                    type="text"
                    class="rounded-lg px-4 py-2 w-full bg-[#292727] font-light focus:bg-[#211E1F] focus:outline-none border-2 border-[#292727] col-span-2 text-lg md:col-span-1 lg:text-xl"
                    id="weapon-search-box"
                    placeholder="Type skin name here..."
                />
                <select
                    class="rounded-lg px-4 py-2 w-full bg-[#292727] border-2 border-[#292727] font-light text-lg md:w-full lg:text-xl"
                    name="Editions sort"
                    id="edition-select"
                >
                    <option value="value">All editions</option>
                    <option value="value">
                        <img
                            src="https://media.valorant-api.com/contenttiers/e046854e-406c-37f4-6607-19a9ba8426fc/displayicon.png"
                            alt=""
                            class=""
                            id="edition-icon"
                        />
                        <p>Exclusive edition</p>
                    </option>
                    <option value="value">Premium edition</option>
                    <option value="value">Select edition</option>
                    <option value="value">Ultra edition</option>
                </select>
                <select
                    class="rounded-lg px-4 py-2 w-full bg-[#292727] border-2 border-[#292727] font-light text-lg md:w-full lg:text-xl"
                    name="Weapons sort"
                    id="weapon-select"
                >
                    <option value="value">Melee</option>
                    <option value="value">Vandal</option>
                    <option value="value">Operator</option>
                    <option value="value">Phantom</option>
                </select>
            </div>
            <div class="flex flex-col gap-1 w-full" id="deluxe-block">
                <div class="flex items-center gap-1" id="title">
                    <img
                        src="https://media.valorant-api.com/contenttiers/e046854e-406c-37f4-6607-19a9ba8426fc/displayicon.png"
                        alt="Exclusive image"
                        class="h-4 lg:h-5"
                        id="edition-image"
                    />
                    <p class="font-light lg:text-lg" id="edition-name">
                        Exclusive edition
                    </p>
                </div>
                <div
                    class="grid grid-cols-2 gap-2 md:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5"
                    id="cards-wrapper"
                >
                    <div
                        class="rounded-lg overflow-hidden cursor-pointer hover:outline-2 hover:outline-[#FF4248]"
                        id="card"
                    >
                        <div
                            class="flex flex-col justify-center items-center h-37 p-8 bg-[#211E1F]"
                            id="img-wrapper"
                        >
                            <img
                                src="https://media.valorant-api.com/weaponskins/3a079e06-4b63-2293-fbd8-4fb896e8af3d/displayicon.png"
                                alt="Dolmir's Revenge Vandal image"
                                class="max-h-full max-w-full"
                                id="skin-img"
                            />
                        </div>
                        <p
                            class="bg-[#292727] px-4 py-2 text-lg lg:text-xl"
                            id="title"
                        >
                            Dolmir's Revenge Vandal
                        </p>
                    </div>
                </div>
            </div>
        </main>

        <footer
            class="flex justify-between items-center bg-[#111111] border-t-2 border-[#333333] px-24 py-2 w-full mt-auto text-lg font-light lg:px-49"
        >
            <p class="" id="footer-text">
                Data provided by
                <a
                    href="https://valorant-api.com"
                    class="text-[#FF4248] hover:underline"
                    >valorant-api.com</a
                >
            </p>

            <div class="flex gap-2" id="footer-buttons">
                <a
                    href="https://github.com/Legionidk/vskins"
                    id="github-button"
                    target="_blank"
                >
                    <img
                        src="/src/img/github.svg"
                        alt="Github logo"
                        class="rounded-lg p-2 hover:bg-[#292727]"
                        id="github-logo"
                    />
                </a>
                <a href="#" id="yo-button">
                    <img
                        src="/src/img/yo.png"
                        alt="yo image"
                        class="rounded-lg p-2 hover:bg-[#292727]"
                        id="github-logo"
                    />
                </a>
            </div>
        </footer>

        <script type="module" src="js/events.js"></script>
        <script>
            document.body.querySelector("video").volume = 0.25;
        </script>
    </body>
</html>
