<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
        <link href="style.css" rel="stylesheet" />
    </head>
    <body
        class="flex flex-col items-center gap-5 min-h-screen bg-[#111111] bg-[url(src/assets/img/background.png)] bg-cover bg-no-repeat font-[Oswald] text-[#FDFDFD]"
    >
        <div
            class="hidden flex justify-center items-center fixed w-full min-h-screen top-0"
            id="popup-container"
        >
            <div class="rounded-2xl bg-[#211E1F] z-1 w-80 p-2" id="popup">
                <img
                    src="src/assets/img/rigby.jpg"
                    alt="Rigby image"
                    class="rounded-lg"
                    id="cat-img"
                />
            </div>
            <div
                class="bg-black/50 h-screen w-full fixed z-0"
                id="background-popup"
            ></div>
        </div>

        <div
            class="hidden flex justify-center items-center fixed w-full min-h-screen top-0"
            id="popup-container"
        >
            <div
                class="rounded-2xl bg-[#292727] w-101 md:w-126 lg:w-187 z-1 overflow-hidden"
                id="popup"
            >
                <div
                    class="flex items-center justify-between w-full px-4 py-2 text-xl lg:text-2xl"
                    id="title"
                >
                    <p id="weapon-name"></p>
                    <p
                        class="text-[#FDFDFD]/75 font-light"
                        id="weapon-category"
                    ></p>
                </div>

                <div
                    class="h-75 bg-[#211E1F] flex justify-center items-center"
                    id="img-wrapper"
                >
                    <img src="" alt="Weapon image" id="weapon-image" />
                </div>

                <div
                    class="grid grid-cols-3 p-2 gap-2"
                    id="weapon-info-wrapper"
                >
                    <div
                        class="py-1 bg-[#211E1F] rounded-lg flex justify-center w-full col-span-3 font-light text-lg lg:text-xl"
                        id="weapon-cost-block"
                    ></div>

                    <div
                        class="bg-[#211E1F] rounded-lg w-full border-2 border-[#211E1F] overflow-hidden"
                        id="fire-rate-block"
                    >
                        <p
                            class="font-light text-lg flex justify-center py-1 lg:text-xl"
                            id="block-title"
                        >
                            Fire rate
                        </p>
                        <div
                            class="font-light text-lg flex flex-col justify-center items-center py-4 bg-[#292727] lg:text-xl lg:flex-row lg:gap-2"
                            id="block-info"
                        >
                            <p class="text-xl lg:text-2xl" id="value"></p>
                            <p
                                class="text-lg lg:text:xl font-light text-[#FDFDFD]/75"
                            >
                                RDS/SEC
                            </p>
                        </div>
                    </div>

                    <div
                        class="bg-[#211E1F] rounded-lg w-full border-2 border-[#211E1F] overflow-hidden"
                        id="first-shot-block"
                    >
                        <p
                            class="font-light text-lg flex justify-center py-1 lg:text-xl"
                            id="block-title"
                        >
                            1st shot spread
                        </p>
                        <div
                            class="font-light text-lg flex flex-col items-center justify-center py-4 bg-[#292727] lg:flex-row lg:gap-2"
                            id="block-info"
                        >
                            <p class="text-xl lg:text-2xl" id="value"></p>
                            <p
                                class="text-lg lg:text-xl font-light text-[#FDFDFD]/75"
                            >
                                DEG (HIP/ADS)
                            </p>
                        </div>
                    </div>

                    <div
                        class="bg-[#211E1F] rounded-lg w-full border-2 border-[#211E1F] overflow-hidden"
                        id="magazine-block"
                    >
                        <p
                            class="font-light text-lg flex justify-center py-1 lg:text-xl"
                            id="block-title"
                        >
                            Magazine
                        </p>
                        <div
                            class="font-light text-lg flex flex-col items-center justify-center py-4 bg-[#292727] lg:flex-row lg:gap-2"
                            id="block-info"
                        >
                            <p class="text-xl lg:text-2xl" id="value"></p>
                            <p
                                class="text-lg lg:text-xl font-light text-[#FDFDFD]/75"
                            >
                                RDS
                            </p>
                        </div>
                    </div>

                    <div
                        class="bg-[#211E1F] rounded-lg w-full border-2 border-[#211E1F] overflow-hidden"
                        id="reload-speed-block"
                    >
                        <p
                            class="font-light text-lg flex justify-center py-1 lg:text-xl"
                            id="block-title"
                        >
                            Reload speed
                        </p>
                        <div
                            class="font-light text-lg flex flex-col items-center justify-center py-4 bg-[#292727] lg:flex-row lg:gap-2"
                            id="block-info"
                        >
                            <p class="text-xl lg:text-2xl" id="value"></p>
                            <p
                                class="text-lg lg:text-xl font-light text-[#FDFDFD]/75"
                            >
                                SEC
                            </p>
                        </div>
                    </div>

                    <div
                        class="bg-[#211E1F] rounded-lg w-full border-2 border-[#211E1F] overflow-hidden"
                        id="equip-speed-block"
                    >
                        <p
                            class="font-light text-lg flex justify-center py-1 lg:text-xl"
                            id="block-title"
                        >
                            Equip speed
                        </p>
                        <div
                            class="font-light text-lg flex flex-col items-center justify-center py-4 bg-[#292727] lg:flex-row lg:gap-2"
                            id="block-info"
                        >
                            <p class="text-xl lg:text-2xl" id="value"></p>
                            <p
                                class="text-lg lg:text-xl font-light text-[#FDFDFD]/75"
                            >
                                SEC
                            </p>
                        </div>
                    </div>

                    <div
                        class="bg-[#211E1F] rounded-lg w-full border-2 border-[#211E1F] overflow-hidden"
                        id="run-speed-block"
                    >
                        <p
                            class="font-light text-lg flex justify-center py-1 lg:text-xl"
                            id="block-title"
                        >
                            Run speed mult
                        </p>
                        <div
                            class="font-light text-lg flex flex-col items-center justify-center py-4 bg-[#292727] lg:flex-row lg:gap-2"
                            id="block-info"
                        >
                            <p class="text-xl lg:text-2xl" id="value"></p>
                            <p
                                class="text-lg lg:text-xl font-light text-[#FDFDFD]/75"
                            >
                                M/SEC
                            </p>
                        </div>
                    </div>

                    <!-- classes for this table is SHIT, need review -->
                    <table
                        class="col-span-3 text-center border-2 border-[#211E1F] rounded-lg border-separate border-spacing-0"
                        id="damage-table"
                    >
                        <thead class="bg-[#211E1F]">
                            <tr>
                                <td
                                    class="text-lg font-light py-1 lg:text-xl"
                                    colspan="3"
                                >
                                    Damage
                                </td>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="text-xl lg:text-2xl">
                                <td
                                    class="border-b-2 border-[#211E1F] py-1"
                                ></td>
                                <td class="border-b-2 border-[#211E1F] py-1">
                                    0-30m
                                </td>
                                <td class="border-b-2 border-[#211E1F] py-1">
                                    30-50m
                                </td>
                            </tr>
                            <tr>
                                <td
                                    class="text-xl lg:text-2xl border-b-2 border-[#211E1F] py-1"
                                >
                                    Head
                                </td>
                                <td
                                    class="text-base lg:text-lg font-light border-b-2 border-[#211E1F] py-1"
                                >
                                    78
                                </td>
                                <td
                                    class="text-base lg:text-lg font-light border-b-2 border-[#211E1F] py-1"
                                >
                                    66
                                </td>
                            </tr>
                            <tr>
                                <td
                                    class="text-xl lg:text-2xl border-b-2 border-[#211E1F] py-1"
                                >
                                    Body
                                </td>
                                <td
                                    class="text-base lg:text-lg font-light border-b-2 border-[#211E1F] py-1"
                                >
                                    26
                                </td>
                                <td
                                    class="text-base lg:text-lg font-light border-b-2 border-[#211E1F] py-1"
                                >
                                    22
                                </td>
                            </tr>
                            <tr>
                                <td class="text-xl lg:text-2xl py-1">Legs</td>
                                <td class="text-base font-light py-1">22</td>
                                <td class="text-base font-light py-1">18</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div
                class="bg-black/50 h-screen w-full fixed z-0"
                id="background-popup"
            ></div>
        </div>

        <header
            class="flex items-center justify-center gap-6 w-full px-24 py-2 bg-[#111111] border-b-2 border-[#333333] text-lg md:justify-start lg:text-xl lg:px-49"
        >
            <img
                src="src/assets/img/asgard.svg"
                alt="Asgard logo"
                class="h-5"
                id="asgard-logo"
            />
            <div class="flex gap-2" id="nav-buttons">
                <a
                    href="#"
                    class="rounded-lg px-4 py-2 pointer-events-none text-[#FF4248]"
                    id="weapons-button"
                    >Weapons</a
                >
                <a
                    href="src/pages/skins/index.html"
                    class="rounded-lg px-4 py-2 hover:bg-[#292727]"
                    id="skins-button"
                    >Skins</a
                >
                <a
                    href="src/pages/agents/index.html"
                    class="rounded-lg px-4 py-2 hover:bg-[#292727]"
                    id="agents-button"
                    >Agents</a
                >
            </div>
        </header>

        <div
            class="rounded-[50%] border-4 border-[#292727] border-b-[#FF4248] animate-spin h-10 w-10"
            id="load-spinner"
        ></div>

        <main
            class="hidden flex flex-col items-center justify-center gap-5 px-24 w-full lg:px-49"
        >
            <input
                type="text"
                class="rounded-lg px-4 py-2 w-full bg-[#292727] font-light focus:bg-[#211E1F] focus:outline-none border-2 border-[#292727] text-lg lg:text-xl"
                id="weapon-search-box"
                placeholder="Type weapon name here..."
            />
        </main>

        <footer
            class="flex justify-between items-center bg-[#111111] border-t-2 border-[#333333] px-24 py-2 w-full mt-auto text-lg font-light lg:px-49"
        >
            <p class="" id="footer-text">
                Data provided by
                <a
                    href="https://valorant-api.com"
                    class="text-[#FF4248] hover:underline"
                    >valorant-api.com</a
                >
            </p>

            <div class="flex gap-2" id="footer-buttons">
                <a
                    href="https://github.com/Legionidk/vskins"
                    id="github-button"
                    target="_blank"
                >
                    <img
                        src="src/assets/img/github.svg"
                        alt="Github logo"
                        class="rounded-lg p-2 hover:bg-[#292727]"
                        id="github-logo"
                    />
                </a>
                <a href="#" id="yo-button">
                    <img
                        src="src/assets/img/yo.png"
                        alt="yo image"
                        class="rounded-lg p-2 hover:bg-[#292727]"
                        id="github-logo"
                    />
                </a>
            </div>
        </footer>

        <script type="module" src="main.js"></script>
    </body>
</html>
