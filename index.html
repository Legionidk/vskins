<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="/src/style.css" rel="stylesheet" />
    </head>
    <body
        class="flex flex-col items-center gap-[20px] min-h-screen bg-[url(img/background.png)] bg-cover bg-no-repeat font-[Oswald] text-[#FDFDFD]"
    >
        <header
            class="flex items-center justify-center gap-[25px] w-full px-[100px] py-[10px] bg-[#111111] border-b-[2px] border-[#333333]"
        >
            <img
                src="/src/img/asgard.svg"
                alt="Asgard logo"
                class="h-[20px]"
                id="asgard-logo"
            />
            <div class="flex text-lg gap-[10px]" id="nav-buttons">
                <a
                    href="#"
                    class="rounded-md px-[16px] py-[8px] pointer-events-none text-[#FF4248]"
                    id="weapons-button"
                    >Weapons</a
                >
                <a
                    href="#"
                    class="rounded-md px-[16px] py-[8px] hover:bg-[#292727]"
                    id="skins-button"
                    >Skins</a
                >
                <a
                    href="#"
                    class="rounded-md px-[16px] py-[8px] hover:bg-[#292727]"
                    id="agents-button"
                    >Agents</a
                >
            </div>
        </header>

        <main
            class="flex flex-col items-center justify-center gap-[20px] px-[100px] w-full"
        >
            <input
                type="text"
                class="rounded-md px-[18px] py-[6px] w-full bg-[#292727] font-light focus:bg-[#211E1F] focus:outline-[2px] focus:outline-[#292727]"
                id="weapon-search-box"
                placeholder="Type weapon name here..."
            />
            <div class="flex flex-col gap-[5px] w-full" id="sidearms-block">
                <p class="font-light" id="title">Sidearms</p>
                <div class="grid grid-cols-2 gap-[10px]" id="cards-wrapper">
                    <div class="rounded-md overflow-hidden" id="classic-card">
                        <div
                            class="flex flex-col h-[150px] justify-center items-center px-[25px] py-[25px] bg-[#211E1F]"
                            id="img-wrapper"
                        >
                            <img
                                src="https://media.valorant-api.com/weapons/29a0cfab-485b-f5d5-779a-b59f85e204a8/displayicon.png"
                                alt="Classic image"
                                class="max-h-full max-w-full"
                                id="weapon-img"
                            />
                        </div>
                        <p
                            class="bg-[#292727] px-[16px] py-[8px] text-lg"
                            id="title"
                        >
                            Classic
                        </p>
                    </div>
                    <div class="rounded-md overflow-hidden" id="shorty-card">
                        <div
                            class="flex flex-col h-[150px] justify-center items-center px-[25px] py-[25px] bg-[#211E1F]"
                            id="img-wrapper"
                        >
                            <img
                                src="https://media.valorant-api.com/weapons/42da8ccc-40d5-affc-beec-15aa47b42eda/displayicon.png"
                                alt="Shorty image"
                                class="max-h-full max-w-full"
                                id="weapon-img"
                            />
                        </div>
                        <p
                            class="bg-[#292727] px-[16px] py-[8px] text-lg"
                            id="title"
                        >
                            Shorty
                        </p>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
