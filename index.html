<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
        <link href="style.css" rel="stylesheet" />
        <script
            src="https://kit.fontawesome.com/6cc4f903af.js"
            crossorigin="anonymous"
        ></script>
    </head>
    <body
        class="flex flex-col items-center gap-[20px] min-h-screen bg-[#111111] bg-[url(src/assets/img/background.png)] bg-cover bg-no-repeat font-[Oswald] text-[#FDFDFD]"
    >
        <div
            class="hidden fixed h-screen w-full bg-[#111111]"
            id="popup-container"
            data-popup-type="burger"
        >
            <div
                class="flex items-center justify-between w-full h-[48px] px-[50px] py-[8px] border-b-2 border-[#333333]"
                id="burger-header"
            >
                <img
                    src="src/assets/img/asgard.svg"
                    alt="Asgard logo"
                    class="h-[20px]"
                    id="asgard-logo"
                />

                <i
                    class="fa-solid fa-xmark cursor-pointer"
                    id="burger-close-button"
                ></i>
            </div>

            <div
                class="flex flex-col gap-[10px] px-[50px] py-[10px] text-lg"
                id="buttons"
            >
                <a
                    class="pointer-events-none text-[#FF4248]"
                    href="src/pages/skins/index.html"
                    >Weapons</a
                >
                <a href="src/pages/skins/index.html">Skins</a>
                <a href="src/pages/agents/index.html">Agents</a>
            </div>
        </div>

        <div
            class="hidden flex justify-center items-center fixed w-full min-h-screen top-0 bg-black/50"
            id="popup-container"
            data-popup-type="rigby"
        >
            <div class="rounded-[16px] bg-[#211E1F] p-[8px] z-1" id="popup">
                <img
                    src="src/assets/img/rigby.jpg"
                    alt="Rigby image"
                    class="rounded-[8px] h-[300px] w-[300px]"
                    id="cat-img"
                />
            </div>
        </div>

        <div
            class="hidden flex justify-center items fixed w-full min-h-screen max-h-screen bg-black/50 overflow-y-auto py-[75px]"
            id="popup-container"
            data-popup-type="weapon"
        >
            <div
                class="rounded-[18px] bg-[#292727] w-[260px] h-fit z-1 overflow-hidden m-auto sm:w-[540px] md:w-[668px] lg:w-[768px]"
                id="popup"
            >
                <div
                    class="flex items-center justify-between w-full px-[16px] py-[8px] text-lg xl:text-2xl"
                    id="title"
                >
                    <p id="weapon-name"></p>
                    <p
                        class="text-[#FDFDFD]/75 font-light"
                        id="weapon-category"
                    ></p>
                </div>

                <div
                    class="h-[150px] bg-[#211E1F] flex justify-center items-center px-[20px] py-[10px] xl:h-[300px] xl:px-[40px] xl:py-[20px]"
                    id="img-wrapper"
                >
                    <img
                        class="max-h-full max-w-full"
                        src=""
                        alt="Weapon image"
                        id="weapon-image"
                    />
                </div>

                <div
                    class="grid grid-cols-2 p-[8px] gap-[8px] sm:grid-cols-3"
                    id="weapon-info-wrapper"
                >
                    <div
                        class="py-[5px] bg-[#211E1F] rounded-[8px] flex justify-center w-full col-span-2 font-light sm:col-span-3 xl:text-xl"
                        id="weapon-cost-block"
                    ></div>

                    <div
                        class="bg-[#211E1F] rounded-[8px] w-full border-2 border-[#211E1F] overflow-hidden"
                        id="fire-rate-block"
                    >
                        <p
                            class="font-light flex justify-center py-[5px] xl:text-xl"
                            id="block-title"
                        >
                            Fire rate
                        </p>
                        <div
                            class="flex flex-col justify-center items-center py-4 bg-[#292727] sm:flex-row sm:gap-[8px]"
                            id="block-info"
                        >
                            <p class="text-lg xl:text-2xl" id="value"></p>
                            <p class="font-light text-[#FDFDFD]/75">RDS/SEC</p>
                        </div>
                    </div>

                    <div
                        class="bg-[#211E1F] rounded-[8px] w-full border-2 border-[#211E1F] overflow-hidden"
                        id="first-shot-block"
                    >
                        <p
                            class="font-light flex justify-center py-[5px] xl:text-xl"
                            id="block-title"
                        >
                            1st shot spread
                        </p>
                        <div
                            class="flex flex-col justify-center items-center py-4 bg-[#292727] sm:flex-row sm:gap-[8px]"
                            id="block-info"
                        >
                            <p class="text-lg xl:text-2xl" id="value"></p>
                            <p class="font-light text-[#FDFDFD]/75">
                                DEG (HIP/ADS)
                            </p>
                        </div>
                    </div>

                    <div
                        class="bg-[#211E1F] rounded-[8px] w-full border-2 border-[#211E1F] overflow-hidden"
                        id="magazine-block"
                    >
                        <p
                            class="font-light flex justify-center py-[5px] xl:text-xl"
                            id="block-title"
                        >
                            Magazine
                        </p>
                        <div
                            class="flex flex-col justify-center items-center py-4 bg-[#292727] sm:flex-row sm:gap-[8px]"
                            id="block-info"
                        >
                            <p class="text-lg xl:text-2xl" id="value"></p>
                            <p class="font-light text-[#FDFDFD]/75">RDS</p>
                        </div>
                    </div>

                    <div
                        class="bg-[#211E1F] rounded-[8px] w-full border-2 border-[#211E1F] overflow-hidden"
                        id="reload-speed-block"
                    >
                        <p
                            class="font-light flex justify-center py-[5px] xl:text-xl"
                            id="block-title"
                        >
                            Reload speed
                        </p>
                        <div
                            class="flex flex-col justify-center items-center py-4 bg-[#292727] sm:flex-row sm:gap-[8px]"
                            id="block-info"
                        >
                            <p class="text-lg xl:text-2xl" id="value"></p>
                            <p class="font-light text-[#FDFDFD]/75">SEC</p>
                        </div>
                    </div>

                    <div
                        class="bg-[#211E1F] rounded-[8px] w-full border-2 border-[#211E1F] overflow-hidden"
                        id="equip-speed-block"
                    >
                        <p
                            class="font-light flex justify-center py-[5px] xl:text-xl"
                            id="block-title"
                        >
                            Equip speed
                        </p>
                        <div
                            class="flex flex-col justify-center items-center py-4 bg-[#292727] sm:flex-row sm:gap-[8px]"
                            id="block-info"
                        >
                            <p class="text-lg xl:text-2xl" id="value"></p>
                            <p class="font-light text-[#FDFDFD]/75">SEC</p>
                        </div>
                    </div>

                    <div
                        class="bg-[#211E1F] rounded-[8px] w-full border-2 border-[#211E1F] overflow-hidden"
                        id="run-speed-block"
                    >
                        <p
                            class="font-light flex justify-center py-[5px] xl:text-xl"
                            id="block-title"
                        >
                            Run speed mult
                        </p>
                        <div
                            class="flex flex-col justify-center items-center py-4 bg-[#292727] sm:flex-row sm:gap-[8px]"
                            id="block-info"
                        >
                            <p class="text-lg xl:text-2xl" id="value"></p>
                            <p class="font-light text-[#FDFDFD]/75">M/SEC</p>
                        </div>
                    </div>

                    <!-- classes for this table is SHIT, need review -->
                    <table
                        class="col-span-2 text-center border-2 border-[#211E1F] rounded-[8px] border-separate border-spacing-0 sm:col-span-3"
                        id="damage-table"
                    >
                        <thead class="bg-[#211E1F]">
                            <tr>
                                <td class="font-light py-[5px] xl:text-xl" colspan="9999">
                                    Damage
                                </td>
                            </tr>
                        </thead>
                        <tbody class="text-sm">
                            <tr id="damage-range-tr">
                                <td
                                    class="border-b-2 border-[#211E1F] py-1"
                                ></td>
                            </tr>
                            <tr id="damage-head-tr">
                                <td
                                    class="text-sm border-b-2 border-[#211E1F] py-[5px] sm:text-lg xl:text-2xl"
                                >
                                    Head
                                </td>
                            </tr>
                            <tr id="damage-body-tr">
                                <td
                                    class="text-sm border-b-2 border-[#211E1F] py-[5px] sm:text-lg xl:text-2xl"
                                >
                                    Body
                                </td>
                            </tr>
                            <tr id="damage-legs-tr">
                                <td class="text-sm py-[5px] sm:text-lg xl:text-2xl">
                                    Legs
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <header
            class="flex items-center justify-between gap-[25px] w-full h-[48px] px-[50px] py-[8px] bg-[#111111] border-b-2 border-[#333333] sm:justify-start sm:h-fit xl:px-[200px]"
        >
            <img
                src="src/assets/img/asgard.svg"
                alt="Asgard logo"
                class="h-[20px]"
                id="asgard-logo"
            />

            <div class="sm:hidden" id="burger-open-button">
                <i class="fa-solid fa-align-right cursor-pointer inline"></i>
            </div>

            <div class="hidden flex gap-[10px] sm:flex" id="buttons">
                <a
                    class="pointer-events-none px-[16px] py-[8px] text-lg text-[#FF4248] xl:text-2xl"
                    id="weapons-button"
                    >Weapons</a
                >
                <a
                    href="src/pages/skins/index.html"
                    class="px-[16px] py-[8px] text-lg rounded-[8px] cursor-pointer hover:bg-[#292727] xl:text-2xl"
                    id="weapons-button"
                    >Skins</a
                >
                <a
                    href="src/pages/agents/index.html"
                    class="px-[16px] py-[8px] text-lg rounded-[8px] cursor-pointer hover:bg-[#292727] xl:text-2xl"
                    id="weapons-button"
                    >Agents</a
                >
            </div>
        </header>

        <div
            class="rounded-[50%] border-4 border-[#292727] border-b-[#FF4248] animate-spin h-[40px] w-[40px]"
            id="load-spinner"
        ></div>

        <main
            class="hidden flex flex-col items-center justify-center gap-[20px] px-[50px] w-full xl:px-[200px]"
        >
            <input
                type="text"
                class="rounded-[8px] px-[16px] py-[8px] w-full bg-[#292727] font-light focus:bg-[#211E1F] focus:outline-none border-2 border-[#292727] xl:text-xl"
                id="search-box"
                placeholder="Type weapon name here..."
            />
        </main>

        <footer
            class="flex flex-col justify-center items-center bg-[#111111] border-t-2 border-[#333333] px-[50px] py-[8px] w-full text-lg font-light mt-auto sm:flex-row sm:flex-row-reverse sm:justify-between xl:px-[200px]"
        >
            <div class="flex gap-2" id="footer-buttons">
                <a
                    href="https://github.com/Legionidk/vskins"
                    id="github-button"
                    target="_blank"
                >
                    <img
                        src="src/assets/img/github.svg"
                        alt="Github logo"
                        class="rounded-[8px] p-2 hover:bg-[#292727]"
                        id="github-logo"
                    />
                </a>
                <div class="cursor-pointer" id="yo-button">
                    <img
                        src="src/assets/img/yo.png"
                        alt="yo image"
                        class="rounded-[8px] p-2 hover:bg-[#292727]"
                        id="github-logo"
                    />
                </div>
            </div>

            <p class="text-lg xl:text-2xl" id="footer-text">
                Data provided by
                <a
                    href="https://valorant-api.com"
                    class="text-[#FF4248] hover:underline"
                    >valorant-api.com</a
                >
            </p>
        </footer>

        <script type="module" src="main.js"></script>
        <script type="module" src="src/assets/js/listeners.js"></script>
    </body>
</html>
