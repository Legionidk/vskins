<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon" href="/vskins/assets/favicon-4lAmXoid.ico" type="image/x-icon" />
        <script
            src="https://kit.fontawesome.com/6cc4f903af.js"
            crossorigin="anonymous"
        ></script>
      <script type="module" crossorigin src="/vskins/assets/weapons-DJvpHJyP.js"></script>
      <link rel="modulepreload" crossorigin href="/vskins/assets/modulepreload-polyfill-B5Qt9EMX.js">
      <link rel="stylesheet" crossorigin href="/vskins/assets/weapons-kIKoyvW9.css">
    </head>
    <body
        class="flex flex-col items-center gap-[20px] min-h-screen bg-[#111111] bg-[url(src/assets/img/background.png)] bg-cover bg-no-repeat font-[Oswald] text-[#FDFDFD]"
    >
        <div
            class="hidden fixed h-screen w-full bg-[#111111]"
            id="popup-container"
            data-popup-type="burger"
        >
            <div
                class="flex items-center justify-between w-full h-[48px] px-[50px] py-[8px] border-b-2 border-[#333333]"
                id="burger-header"
            >
                <img
                    src="/vskins/assets/asgard-CgqbrZxk.svg"
                    alt="Asgard logo"
                    class="h-[20px]"
                    id="asgard-logo"
                />

                <i
                    class="fa-solid fa-xmark cursor-pointer"
                    id="burger-close-button"
                ></i>
            </div>

            <div
                class="flex flex-col gap-[10px] px-[50px] py-[10px] text-lg"
                id="buttons"
            >
                <a
                    class="pointer-events-none text-[#FF4248]"
                    href="src/pages/skins/index.html"
                    >Weapons</a
                >
                <a href="src/pages/skins/index.html">Skins</a>
                <a href="src/pages/agents/index.html">Agents</a>
            </div>
        </div>

        <div
            class="hidden flex justify-center items-center fixed w-full min-h-screen top-0"
            id="popup-container"
            data-popup-type="rigby"
        >
            <div class="rounded-[16px] bg-[#211E1F] p-[8px] z-1" id="popup">
                <img
                    src="/vskins/assets/rigby-CLRj2kqn.jpg"
                    alt="Rigby image"
                    class="rounded-[8px] h-[300px] w-[300px]"
                    id="cat-img"
                />
            </div>

            <div
                class="bg-black/50 h-screen w-full fixed z-0"
                id="popup-background"
            ></div>
        </div>

        <div
            class="hidden flex justify-center items-center fixed w-full min-h-screen"
            id="popup-container"
            data-popup-type="weapon"
        >
            <div
                class="rounded-[18px] bg-[#292727] w-[264px] z-1 overflow-hidden"
                id="popup"
            >
                <div
                    class="flex items-center justify-between w-full px-[16px] py-[8px] text-lg"
                    id="title"
                >
                    <p id="weapon-name"></p>
                    <p
                        class="text-[#FDFDFD]/75 font-light"
                        id="weapon-category"
                    ></p>
                </div>

                <div
                    class="h-[150px] bg-[#211E1F] flex justify-center items-center px-[20px] py-[10px]"
                    id="img-wrapper"
                >
                    <img
                        class="max-h-full max-w-full"
                        src=""
                        alt="Weapon image"
                        id="weapon-image"
                    />
                </div>

                <div
                    class="grid grid-cols-2 p-[8px] gap-[8px]"
                    id="weapon-info-wrapper"
                >
                    <div
                        class="py-[5px] bg-[#211E1F] rounded-lg flex justify-center w-full col-span-2 font-light"
                        id="weapon-cost-block"
                    ></div>

                    <div
                        class="bg-[#211E1F] rounded-[8px] w-full border-2 border-[#211E1F] overflow-hidden"
                        id="fire-rate-block"
                    >
                        <p
                            class="font-light flex justify-center py-[5px]"
                            id="block-title"
                        >
                            Fire rate
                        </p>
                        <div
                            class="flex flex-col justify-center items-center py-4 bg-[#292727]"
                            id="block-info"
                        >
                            <p class="text-lg" id="value"></p>
                            <p class="font-light text-[#FDFDFD]/75">RDS/SEC</p>
                        </div>
                    </div>

                    <div
                        class="bg-[#211E1F] rounded-lg w-full border-2 border-[#211E1F] overflow-hidden"
                        id="first-shot-block"
                    >
                        <p
                            class="font-light flex justify-center py-[5px]"
                            id="block-title"
                        >
                            1st shot spread
                        </p>
                        <div
                            class="flex flex-col justify-center items-center py-4 bg-[#292727]"
                            id="block-info"
                        >
                            <p class="text-lg" id="value"></p>
                            <p class="font-light text-[#FDFDFD]/75">
                                DEG (HIP/ADS)
                            </p>
                        </div>
                    </div>

                    <div
                        class="bg-[#211E1F] rounded-lg w-full border-2 border-[#211E1F] overflow-hidden"
                        id="magazine-block"
                    >
                        <p
                            class="font-light flex justify-center py-[5px]"
                            id="block-title"
                        >
                            Magazine
                        </p>
                        <div
                            class="flex flex-col justify-center items-center py-4 bg-[#292727]"
                            id="block-info"
                        >
                            <p class="text-lg" id="value"></p>
                            <p class="font-light text-[#FDFDFD]/75">RDS</p>
                        </div>
                    </div>

                    <div
                        class="bg-[#211E1F] rounded-lg w-full border-2 border-[#211E1F] overflow-hidden"
                        id="reload-speed-block"
                    >
                        <p
                            class="font-light flex justify-center py-[5px]"
                            id="block-title"
                        >
                            Reload speed
                        </p>
                        <div
                            class="flex flex-col justify-center items-center py-4 bg-[#292727]"
                            id="block-info"
                        >
                            <p class="text-lg" id="value"></p>
                            <p class="font-light text-[#FDFDFD]/75">SEC</p>
                        </div>
                    </div>

                    <div
                        class="bg-[#211E1F] rounded-lg w-full border-2 border-[#211E1F] overflow-hidden"
                        id="equip-speed-block"
                    >
                        <p
                            class="font-light flex justify-center py-[5px]"
                            id="block-title"
                        >
                            Equip speed
                        </p>
                        <div
                            class="flex flex-col justify-center items-center py-4 bg-[#292727]"
                            id="block-info"
                        >
                            <p class="text-lg" id="value"></p>
                            <p class="font-light text-[#FDFDFD]/75">SEC</p>
                        </div>
                    </div>

                    <div
                        class="bg-[#211E1F] rounded-lg w-full border-2 border-[#211E1F] overflow-hidden"
                        id="run-speed-block"
                    >
                        <p
                            class="font-light flex justify-center py-[5px]"
                            id="block-title"
                        >
                            Run speed mult
                        </p>
                        <div
                            class="flex flex-col justify-center items-center py-4 bg-[#292727]"
                            id="block-info"
                        >
                            <p class="text-lg" id="value"></p>
                            <p class="font-light text-[#FDFDFD]/75">M/SEC</p>
                        </div>
                    </div>

                    <!-- classes for this table is SHIT, need review -->
                    <table
                        class="col-span-2 text-center border-2 border-[#211E1F] rounded-lg border-separate border-spacing-0"
                        id="damage-table"
                    >
                        <thead class="bg-[#211E1F]">
                            <tr>
                                <td class="font-light py-[5px]" colspan="9999">
                                    Damage
                                </td>
                            </tr>
                        </thead>
                        <tbody class="text-sm">
                            <tr id="damage-range-tr">
                                <td
                                    class="border-b-2 border-[#211E1F] py-1"
                                ></td>
                            </tr>
                            <tr id="damage-head-tr">
                                <td
                                    class="text-sm border-b-2 border-[#211E1F] py-[5px]"
                                >
                                    Head
                                </td>
                            </tr>
                            <tr id="damage-body-tr">
                                <td
                                    class="text-sm border-b-2 border-[#211E1F] py-[5px]"
                                >
                                    Body
                                </td>
                            </tr>
                            <tr id="damage-legs-tr">
                                <td class="text-sm py-[5px]">Legs</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div
                class="bg-black/50 h-screen w-full fixed z-0"
                id="popup-background"
            ></div>
        </div>

        <header
            class="flex items-center justify-between w-full h-[48px] px-[50px] py-[8px] bg-[#111111] border-b-2 border-[#333333]"
        >
            <img
                src="/vskins/assets/asgard-CgqbrZxk.svg"
                alt="Asgard logo"
                class="h-[20px]"
                id="asgard-logo"
            />

            <i
                class="fa-solid fa-align-right cursor-pointer"
                id="burger-open-button"
            ></i>
        </header>

        <div
            class="rounded-[50%] border-4 border-[#292727] border-b-[#FF4248] animate-spin h-[40px] w-[40px]"
            id="load-spinner"
        ></div>

        <main
            class="hidden flex flex-col items-center justify-center gap-[20px] px-[50px] w-full"
        >
            <input
                type="text"
                class="rounded-[8px] px-[16px] py-[8px] w-full bg-[#292727] font-light focus:bg-[#211E1F] focus:outline-none border-2 border-[#292727]"
                id="search-box"
                placeholder="Type weapon name here..."
            />
        </main>
